<svg xmlns="http://www.w3.org/2000/svg" width="360" height="850" viewBox="0 0 360 850" role="img" aria-label="Separar selección sin gold de evaluación de evidencia"><rect width="360" height="850" rx="12" fill="#0f172a"/><g font-family="system-ui,sans-serif" fill="#e2e8f0" text-anchor="middle"><text x="180" y="28" font-size="16">Qué evidencia llega a la entrada</text><rect x="16" y="50" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="77" font-size="14">Ranking BM25 guardado</text><text x="180" y="100" font-size="11">Candidatos: hasta tres IDs por pregunta</text><path d="M180 123v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="148" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="175" font-size="14">Constructor sin acceso al gold</text><text x="180" y="198" font-size="11">System + pregunta + JSON de fuentes</text><path d="M180 221v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="246" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="273" font-size="14">Medir el chat completo</text><text x="180" y="296" font-size="11">Tokenizer fijado; sin padding ni recorte</text><path d="M180 319v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="344" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="371" font-size="14">Admitir cada fuente completa</text><text x="180" y="394" font-size="11">Si no cabe, probar el siguiente candidato</text><path d="M180 417v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="442" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="469" font-size="14">Conservar la entrada resultante</text><text x="180" y="492" font-size="11">Textos, mensajes, IDs y conteos reales</text><path d="M180 515v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="540" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="567" font-size="14">Evaluar después con el gold</text><text x="180" y="590" font-size="11">Documentos, hechos y rangos anotados</text><path d="M180 613v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="638" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="665" font-size="14">Tres denominadores diferentes</text><text x="180" y="688" font-size="11">Seleccionadas; hechos; texto de fuentes</text><path d="M180 711v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="736" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="763" font-size="14">No se ejecuta el generador</text><text x="180" y="786" font-size="11">Evidencia disponible no prueba su uso</text></g></svg>
