<svg xmlns="http://www.w3.org/2000/svg" width="360" height="850" viewBox="0 0 360 850" role="img" aria-label="Orden, grados y un ideal explícito"><rect width="360" height="850" rx="12" fill="#0f172a"/><g font-family="system-ui,sans-serif" fill="#e2e8f0" text-anchor="middle"><text x="180" y="28" font-size="16">Orden, grados y un ideal explícito</text><rect x="16" y="50" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="77" font-size="14">Juicio de cada documento</text><text x="180" y="100" font-size="11">Grados 0, 1 y 2 según la rúbrica</text><path d="M180 123v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="148" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="175" font-size="14">Ganancia: 2^grado - 1</text><text x="180" y="198" font-size="11">En esta variante: 0, 1 y 3</text><path d="M180 221v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="246" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="273" font-size="14">Descuento: log2(posición + 1)</text><text x="180" y="296" font-size="11">Los primeros puestos aportan más</text><path d="M180 319v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="344" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="371" font-size="14">DCG: sumar contribuciones</text><text x="180" y="394" font-size="11">Ganancia dividida entre descuento</text><path d="M180 417v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="442" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="469" font-size="14">IDCG: ideal de todos los qrels</text><text x="180" y="492" font-size="11">No construirlo sólo con lo recuperado</text><path d="M180 515v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="540" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="567" font-size="14">nDCG = DCG / IDCG</text><text x="180" y="590" font-size="11">Si IDCG = 0: no definido</text><path d="M180 613v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="638" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="665" font-size="14">Comparar al mismo cutoff</text><text x="180" y="688" font-size="11">nDCG@1 = 1 puede omitir otra fuente</text><path d="M180 711v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="736" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="763" font-size="14">Control escrito ≠ búsqueda real</text><text x="180" y="786" font-size="11">Grados mezclados se ilustran aparte</text></g></svg>
