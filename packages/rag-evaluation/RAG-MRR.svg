<svg xmlns="http://www.w3.org/2000/svg" width="360" height="750" viewBox="0 0 360 750" role="img" aria-label="Dónde aparece el primer acierto"><rect width="360" height="750" rx="12" fill="#0f172a"/><g font-family="system-ui,sans-serif" fill="#e2e8f0" text-anchor="middle"><text x="180" y="28" font-size="16">Dónde aparece el primer acierto</text><rect x="16" y="50" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="77" font-size="14">Lista ordenada y cutoff k</text><text x="180" y="100" font-size="11">Conservar también resultados irrelevantes</text><path d="M180 123v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="148" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="175" font-size="14">Primera posición relevante</text><text x="180" y="198" font-size="11">Numeración desde 1 dentro del prefijo</text><path d="M180 221v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="246" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="273" font-size="14">RR = 1 / posición</text><text x="180" y="296" font-size="11">Si existe gold pero no acierto: RR = 0</text><path d="M180 319v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="344" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="371" font-size="14">MRR = media de RR</text><text x="180" y="394" font-size="11">Declarar las preguntas y su denominador</text><path d="M180 417v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="442" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="469" font-size="14">Un primer acierto puede ser parcial</text><text x="180" y="492" font-size="11">Q008: RR@1 = 1; Recall@1 = 0,5</text><path d="M180 515v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="540" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="567" font-size="14">Gold vacío en este protocolo</text><text x="180" y="590" font-size="11">RR no definido; no entra en MRR</text><path d="M180 613v19m-5-5 5 5 5-5" fill="none" stroke="#38bdf8"/><rect x="16" y="638" width="328" height="70" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="665" font-size="14">Revisar también cobertura</text><text x="180" y="688" font-size="11">MRR = 1 no demuestra respuesta completa</text></g></svg>
