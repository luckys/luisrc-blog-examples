<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-label="Versionar datos y separar desarrollo de test antes de comparar modelos"><rect width="360" height="760" rx="12" fill="#0f172a"/><g font-family="system-ui,sans-serif" fill="#e2e8f0" text-anchor="middle"><text x="180" y="28" font-size="16">Un benchmark empieza por sus etiquetas</text><rect x="16" y="50" width="328" height="72" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="77" font-size="14">Pregunta del producto</text><text x="180" y="100" font-size="11">Qué error importa y qué evidencia lo prueba</text><path d="M180 125v20m-5-5 5 5 5-5" stroke="#38bdf8" fill="none"/><rect x="16" y="150" width="328" height="72" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="177" font-size="14">Corpus y gold versionados</text><text x="180" y="200" font-size="11">Hechos, rangos y juicios explícitos</text><path d="M180 225v20m-5-5 5 5 5-5" stroke="#38bdf8" fill="none"/><rect x="16" y="250" width="328" height="72" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="277" font-size="14">Split por grupos de tema</text><text x="180" y="300" font-size="11">Dev: 2 grupos · test: 6 grupos</text><path d="M180 325v20m-5-5 5 5 5-5" stroke="#38bdf8" fill="none"/><rect x="16" y="350" width="328" height="72" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="377" font-size="14">Dev para elegir configuración</text><text x="180" y="400" font-size="11">Registrar cambios y criterios de aceptación</text><path d="M180 425v20m-5-5 5 5 5-5" stroke="#38bdf8" fill="none"/><rect x="16" y="450" width="328" height="72" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="477" font-size="14">Protocolo y modelos fijados</text><text x="180" y="500" font-size="11">Antes de ejecutar la comparación en test</text><path d="M180 525v20m-5-5 5 5 5-5" stroke="#38bdf8" fill="none"/><rect x="16" y="550" width="328" height="72" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="577" font-size="14">Test con etiquetas sin editar</text><text x="180" y="600" font-size="11">Conservar todas las salidas y sus fallos</text><path d="M180 625v20m-5-5 5 5 5-5" stroke="#38bdf8" fill="none"/><rect x="16" y="650" width="328" height="72" rx="9" fill="#3b2438" stroke="#64748b"/><text x="180" y="677" font-size="14">Esta entrega verifica el dataset</text><text x="180" y="700" font-size="11">Comparación A/B todavía pendiente</text></g></svg>
