<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img" aria-label="Mapa conceptual de intervenciones, no benchmark"><rect width="360" height="600" fill="#0f172a" rx="12"/><text x="180" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f8fafc">Qué intervención cambia cada pieza</text><rect x="18" y="65" width="324" height="105" rx="9" fill="#143047" stroke="#64748b"/><text x="180" y="95" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">Fuentes en runtime</text><text x="180" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">Contenido · versión · permisos</text><text x="180" y="141" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">Fuera de los pesos del modelo</text><rect x="18" y="200" width="324" height="105" rx="9" fill="#1e293b" stroke="#64748b"/><text x="180" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">Prompt y selección de contexto</text><text x="180" y="253" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">Instrucciones · historial · evidencia</text><text x="180" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">Se preparan para una solicitud</text><rect x="18" y="335" width="324" height="105" rx="9" fill="#3b2536" stroke="#64748b"/><text x="180" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">Fine-tuning</text><text x="180" y="388" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">Aprendizaje sobre ejemplos</text><text x="180" y="411" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">Produce pesos o un adaptador</text><text x="180" y="490" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#cbd5e1">Las piezas pueden combinarse.</text><text x="180" y="513" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#cbd5e1">Necesitan evaluación y autorización.</text><text x="180" y="565" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">Mapa conceptual, no comparación medida</text></svg>
