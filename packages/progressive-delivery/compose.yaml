name: luisrc-progressive-delivery
x-api: &api
  pull_policy: never
  environment:
    DATABASE_URL: postgres://lab:public-local-lab-only@postgres:5432/delivery_lab
  ports: ["127.0.0.1::3000"]
  depends_on:
    postgres: { condition: service_healthy }
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  mem_limit: 256m
  cpus: 0.5
  init: true
  networks: [backend, edge]
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 2s
    timeout: 2s
    retries: 30
services:
  a:
    <<: *api
    image: ${SLOT_A_IMAGE:?Define SLOT_A_IMAGE con el image ID local}
  b:
    <<: *api
    image: ${SLOT_B_IMAGE:?Define SLOT_B_IMAGE con el image ID local}
  green:
    <<: *api
    image: ${GREEN_IMAGE:?Define GREEN_IMAGE con el image ID local}
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: public-local-lab-only
      POSTGRES_DB: delivery_lab
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql:/lab/sql:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lab -d delivery_lab]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  pgdata:
networks:
  backend: { internal: true }
  edge:
