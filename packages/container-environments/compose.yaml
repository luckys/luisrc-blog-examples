name: luisrc-container-environments
services:
  api:
    image: ${LAB_IMAGE:-luisrc-container-environments:local}
    build:
      context: ../..
      dockerfile: packages/container-environments/Dockerfile
    environment:
      DATABASE_URL: postgres://lab:public-local-lab-only@postgres:5432/notes_lab
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1::3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    init: true
    networks: [backend, edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: public-local-lab-only
      POSTGRES_DB: notes_lab
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lab -d notes_lab]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    command: [redis-server, --save, "", --appendonly, "no"]
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  pgdata:
networks:
  backend:
    internal: true
  edge:
